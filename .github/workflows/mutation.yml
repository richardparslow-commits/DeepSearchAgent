name: mutation-kill-gate

# The gate runs on every push to main that touches code, tests, the gate
# scripts, or the baseline itself (docs-only pushes are excluded so a README
# edit doesn't burn a full mutmut pass), plus nightly and on demand. Running
# on push is what keeps the baseline honest: a commit that adds a new
# surviving mutant fails *at that commit* instead of silently landing and
# being caught up to 24h later by the schedule. It fails when any module's
# survivor-name set differs from the triaged baseline in
# .mutation-baseline.json - i.e. when a killable mutant has slipped through, an
# equal-count equivalent-for-killable swap occurred, or a new survivor appears
# that has not been triaged as provably equivalent.
# It also fails on any mutant that reaches `timeout` status: a hung test run
# is never an equivalent, and must be fixed to fail fast instead of being
# absorbed into the baseline.
#
# Each module is its own matrix leg. A timeout therefore kills only that
# module's leg: the other modules still run, and the gate job runs after any
# leg failure, downloads the reports that exist, and fails loudly for every
# module whose survivor file is missing. A single long-running step can no
# longer leave later modules unmeasured and unmentioned.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".gitignore"
  schedule:
    - cron: "0 3 * * *"  # nightly at 03:00 UTC (backstop for any missed path)
  workflow_dispatch: {}

jobs:
  mutate:
    name: mutate (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Measure every module even when one fails; the gate reports the
      # missing module rather than leaving later ones unmeasured.
      fail-fast: false
      matrix:
        include:
          - module: providers.py
            tests: tests/test_providers.py tests/test_search.py
            timeout: 25
          - module: queries.py
            tests: tests/test_providers.py tests/test_search.py
            timeout: 20
          - module: search.py
            tests: tests/test_search.py
            timeout: 15
          - module: reliability.py
            tests: tests/test_reliability.py tests/test_legal_agent.py
            timeout: 15
          - module: fetch.py
            tests: tests/test_fetch.py tests/test_legal_agent.py
            timeout: 20
          - module: deep_read.py
            tests: tests/test_deep_read.py tests/test_legal_agent.py
            timeout: 15
          - module: agent.py
            tests: tests/test_legal_agent.py tests/test_research.py
            timeout: 20
          - module: planning.py
            tests: tests/test_planning.py
            timeout: 10
          - module: batch.py
            tests: tests/test_batch.py tests/test_cli.py
            timeout: 15
          - module: config.py
            tests: tests/test_config.py tests/test_cli.py
            timeout: 15
          - module: topics.py
            tests: tests/test_topics.py tests/test_legal_agent.py
            timeout: 10
          - module: interpretation.py
            tests: tests/test_interpretation.py tests/test_topics.py
            timeout: 15
          - module: llm.py
            tests: tests/test_llm.py
            timeout: 10
          - module: impact.py
            tests: tests/test_impact.py
            timeout: 10
          - module: ranking.py
            tests: tests/test_ranking.py
            timeout: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Create the project venv so the Makefile's default PYTHON (.venv/bin/python)
      # resolves exactly as it does locally.
      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install -r requirements-dev.txt

      - name: Mutation pass — ${{ matrix.module }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/mutmut_pass.py ${{ matrix.module }} ${{ matrix.tests }}
        timeout-minutes: ${{ matrix.timeout }}

      # Keep the report even if the pass fails or times out. A missing report
      # is exactly what the gate must see for an unmeasured module.
      - name: Upload survivor identities — ${{ matrix.module }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivors-${{ matrix.module }}
          path: /tmp/mutmut_survivors_${{ matrix.module }}.txt
          if-no-files-found: warn

  gate:
    name: Enforce the kill-property baseline
    needs: mutate
    # Run after failed or timed-out legs too, so missing modules are reported.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download every per-module survivor report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: survivors-*
          path: /tmp
          merge-multiple: true

      - name: Enforce the kill-property baseline
        run: python scripts/check_mutation_baseline.py
