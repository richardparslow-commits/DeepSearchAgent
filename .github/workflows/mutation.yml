name: mutation-kill-gate

# The mutation gate is deliberately not part of the per-push CI: a full
# mutmut pass over the package takes minutes. It runs nightly (and on demand
# via workflow_dispatch) and fails when any module's surviving-mutant count
# exceeds the triaged baseline in .mutation-baseline.json - i.e. when a
# killable mutant has slipped through, or a new survivor appears that has not
# been triaged as provably equivalent.
on:
  schedule:
    - cron: "0 3 * * *"  # nightly at 03:00 UTC
  workflow_dispatch: {}

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Create the project venv so the Makefile's default PYTHON (.venv/bin/python)
      # resolves exactly as it does locally.
      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run the mutation pass (every module)
        run: make mutate

      - name: Enforce the kill-property baseline
        run: .venv/bin/python scripts/check_mutation_baseline.py
