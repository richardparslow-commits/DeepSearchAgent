name: mutation-kill-gate

# The gate runs on every push to main that touches code, tests, the gate
# scripts, or the baseline itself (docs-only pushes are excluded so a README
# edit doesn't burn a full mutmut pass), plus nightly and on demand. Running
# on push is what keeps the baseline honest: a commit that adds a new
# surviving mutant fails *at that commit* instead of silently landing and
# being caught up to 24h later by the schedule. It fails when any module's
# surviving-mutant count exceeds the triaged baseline in
# .mutation-baseline.json - i.e. when a killable mutant has slipped through,
# or a new survivor appears that has not been triaged as provably equivalent.
# It also fails on any mutant that reaches `timeout` status: a hung test run
# is never an equivalent, and must be fixed to fail fast instead of being
# absorbed into baseline headroom.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".gitignore"
  schedule:
    - cron: "0 3 * * *"  # nightly at 03:00 UTC (backstop for any missed path)
  workflow_dispatch: {}

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Create the project venv so the Makefile's default PYTHON (.venv/bin/python)
      # resolves exactly as it does locally.
      - name: Create venv
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install -r requirements-dev.txt

      # Run the heavy modules (providers/queries share test_providers.py,
      # which is the largest test file) with a longer timeout first so they
      # don't starve the remaining passes.
      - name: Mutation pass — heavy modules (providers, queries)
        run: |
          .venv/bin/python scripts/mutmut_pass.py providers.py tests/test_providers.py tests/test_search.py || echo "WARNING: providers mutation pass exited non-zero"
          .venv/bin/python scripts/mutmut_pass.py queries.py tests/test_providers.py tests/test_search.py || echo "WARNING: queries mutation pass exited non-zero"
        timeout-minutes: 20

      - name: Run the mutation pass (remaining modules)
        run: |
          set -e
          .venv/bin/python scripts/mutmut_pass.py search.py tests/test_search.py
          .venv/bin/python scripts/mutmut_pass.py reliability.py tests/test_reliability.py tests/test_legal_agent.py
          .venv/bin/python scripts/mutmut_pass.py fetch.py tests/test_fetch.py tests/test_legal_agent.py
          .venv/bin/python scripts/mutmut_pass.py deep_read.py tests/test_deep_read.py tests/test_legal_agent.py
          .venv/bin/python scripts/mutmut_pass.py agent.py tests/test_legal_agent.py tests/test_research.py
          .venv/bin/python scripts/mutmut_pass.py planning.py tests/test_planning.py
          .venv/bin/python scripts/mutmut_pass.py batch.py tests/test_batch.py tests/test_cli.py
          .venv/bin/python scripts/mutmut_pass.py config.py tests/test_config.py tests/test_cli.py
          .venv/bin/python scripts/mutmut_pass.py models.py tests/test_cli.py tests/test_batch.py
          .venv/bin/python scripts/mutmut_pass.py topics.py tests/test_topics.py tests/test_legal_agent.py
          .venv/bin/python scripts/mutmut_pass.py interpretation.py tests/test_interpretation.py tests/test_topics.py
          .venv/bin/python scripts/mutmut_pass.py llm.py tests/test_llm.py
          .venv/bin/python scripts/mutmut_pass.py impact.py tests/test_impact.py
          .venv/bin/python scripts/mutmut_pass.py ranking.py tests/test_ranking.py
        timeout-minutes: 15

      - name: Enforce the kill-property baseline
        run: .venv/bin/python scripts/check_mutation_baseline.py
