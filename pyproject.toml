[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-legal-agent"
version = "0.1.0"
description = "Legal research and case-analysis agent for U.S. veterans compensation claims"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mutmut>=3.7.0",
    "debugpy==1.8.14",
    "agent-dev-cli==0.0.1b260427",
]
llm = ["openai>=1.35.0,<4"]

[project.scripts]
va-legal-agent = "va_legal_agent.__main__:main"

[tool.setuptools]
packages = ["va_legal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mutmut]
source_paths = ["va_legal_agent/ranking.py"]
use_coverage = true
test_timeout = 30
pytest_add_cli_args_test_selection = ["tests/test_ranking.py"]